<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Budget App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>💶 Budget App</h1>
  </header>

  <main>
    <div id="zone-connexion" class="card">
      <p>Connecte-toi à Google Drive pour charger tes données.</p>
      <button class="btn" id="btn-connecter-drive">Se connecter à Google Drive</button>
    </div>

    <div id="zone-app" class="hidden">
      <div class="grid" id="soldes"></div>

      <div class="grid">
        <div class="card">
          <div class="label">Dépenses du mois</div>
          <div class="stat depense" id="total-depenses">—</div>
        </div>
        <div class="card">
          <div class="label">Revenus du mois</div>
          <div class="stat revenu" id="total-revenus">—</div>
        </div>
      </div>

      <div class="card">
        <p class="label" style="margin-bottom:.5rem">Ajouter une dépense/revenu</p>
        <form id="form-transaction">
          <input type="date" name="date" required>
          <input type="text" name="libelle" placeholder="Libellé" required>
          <input type="number" step="0.01" name="montant" placeholder="Montant (- dépense / + revenu)" required>
          <select name="compte_id" id="select-compte" required></select>
          <select name="categorie_id" id="select-categorie"></select>
          <button type="submit" class="btn">Ajouter</button>
        </form>
      </div>

      <div class="card">
        <p class="label" style="margin-bottom:.5rem">Transactions récentes</p>
        <div id="transactions-liste"></div>
      </div>

      <p class="label" id="statut-synchro" style="text-align:center;margin-top:1rem;"></p>
      <button class="btn secondary" id="btn-connecter-drive-2" onclick="document.getElementById('btn-connecter-drive').click()" style="width:100%;">
        Resynchroniser avec Drive
      </button>
    </div>
  </main>

  <script src="vendor/sql-wasm.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app/main.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
